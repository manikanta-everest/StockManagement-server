name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/docker-publish", "feature/update-api"]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
    
      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/stockmanagement-server:latest ./
          docker push ${{ secrets.DOCKER_USERNAME }}/stockmanagement-server:latest